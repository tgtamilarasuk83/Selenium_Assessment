# ==============================
# Configuration
# ==============================
name = PropertiesConfig
status = error

# Log file folder
property.filename = logs

# ==============================
# Appenders
# ==============================
appenders = console, file

# ------------------------------
# Console Appender (Styled UI)
# ------------------------------
appender.console.type = Console
appender.console.name = STDOUT

appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %style{%d{HH:mm:ss}}{cyan} %highlight{%-5level} %style{[%t]}{magenta} %style{%c{1}}{blue} - %msg%n


# ------------------------------
# File Appender
# ------------------------------
appender.file.type = File
appender.file.name = LOGFILE
appender.file.fileName = ${filename}/application.log

appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} | %-5level | %c{1} | %msg%n


# ==============================
# Loggers
# ==============================

# Root Logger
rootLogger.level = info
rootLogger.appenderRefs = stdout, logfile
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.logfile.ref = LOGFILE
